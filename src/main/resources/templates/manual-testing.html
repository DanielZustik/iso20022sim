<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Testing UI</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f8;
            color: #0f1720;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem 3rem;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d7dde3;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        select, button, textarea {
            font: inherit;
        }

        select, button {
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            border: 1px solid #b9c5d1;
            background: #fff;
        }

        button {
            cursor: pointer;
            background: #0a66c2;
            color: #fff;
            border-color: #0a66c2;
        }

        button:hover {
            background: #0955a3;
        }

        textarea {
            width: 100%;
            min-height: 420px;
            margin-top: 0.75rem;
            border-radius: 10px;
            border: 1px solid #b9c5d1;
            padding: 0.75rem;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 0.93rem;
            line-height: 1.35;
            box-sizing: border-box;
            resize: vertical;
        }

        .status {
            display: inline-block;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            background: #e4e9ef;
            font-weight: 600;
        }

        pre {
            margin: 0.75rem 0 0;
            background: #0d1117;
            color: #dce6f2;
            border-radius: 8px;
            padding: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
<main>
    <h1>Manual Testing UI</h1>
    <p>Load a curated sample request, edit it if needed, then submit it to the same Authorisation API used by integrations.</p>

    <section class="card">
        <div class="row">
            <label for="sampleId">Sample request</label>
            <select id="sampleId" name="sampleId">
                <option th:each="sample : ${samples}"
                        th:value="${sample.id()}"
                        th:text="${sample.displayName()}"
                        th:selected="${sample.id() == defaultSampleId}">Sample</option>
            </select>
            <button id="loadSampleButton" type="button">Load Sample</button>
        </div>
    </section>

    <section class="card">
        <form id="submitForm">
            <label for="requestXml"><strong>Authorisation Request XML</strong></label>
            <textarea id="requestXml" name="requestXml"></textarea>
            <div style="margin-top: 0.75rem;">
                <button id="submitButton" type="submit">Submit to Authorisation API</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2 style="margin-top: 0;">API response</h2>
        <div class="status" id="responseStatus">Not submitted</div>
        <pre id="responseBody"></pre>
    </section>
</main>

<script th:inline="javascript">
    const defaultSampleId = /*[[${defaultSampleId}]]*/ "approved";
</script>
<script>
    const sampleSelect = document.getElementById("sampleId");
    const loadSampleButton = document.getElementById("loadSampleButton");
    const requestXmlField = document.getElementById("requestXml");
    const submitForm = document.getElementById("submitForm");
    const responseStatus = document.getElementById("responseStatus");
    const responseBody = document.getElementById("responseBody");

    async function loadSample(sampleId) {
        responseStatus.textContent = "Loading sample...";
        responseBody.textContent = "";
        const response = await fetch(`/manual-testing/samples/${encodeURIComponent(sampleId)}`, {
            headers: {
                "Accept": "application/xml"
            }
        });
        const body = await response.text();
        if (!response.ok) {
            responseStatus.textContent = `Sample load failed (${response.status})`;
            responseBody.textContent = body;
            return;
        }
        requestXmlField.value = body;
        responseStatus.textContent = "Sample loaded";
    }

    loadSampleButton.addEventListener("click", async () => {
        await loadSample(sampleSelect.value);
    });

    submitForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        responseStatus.textContent = "Submitting...";
        responseBody.textContent = "";

        const response = await fetch("/api/authorisations", {
            method: "POST",
            headers: {
                "Content-Type": "application/xml",
                "Accept": "application/xml,text/plain,*/*"
            },
            body: requestXmlField.value
        });

        const body = await response.text();
        responseStatus.textContent = `${response.status} ${response.statusText}`;
        responseBody.textContent = body;
    });

    loadSample(defaultSampleId).catch((error) => {
        responseStatus.textContent = "Sample load failed";
        responseBody.textContent = String(error);
    });
</script>
</body>
</html>
